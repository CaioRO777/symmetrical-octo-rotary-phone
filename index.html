<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Calcular Média</h1>

      <input type="number" id="nota1" placeholder="Nota 1" />
      <input type="number" id="nota2" placeholder="Nota 2" />
      <input type="number" id="nota3" placeholder="Nota 3" />
      <input type="number" id="nota4" placeholder="Nota 4" />

      <button onclick="calcularMedia()">Calcular</button>

      <p id="resultado"></p>
    </div>
    <footer
      style="
        text-align: center;
        width: 100%;
        padding: 20px 0;
        margin-top: auto;
        font-family: Arial, sans-serif;
      "
    >
      <p style="margin: 0; color: #333">
        Desenvolvido com dedicação por <strong>Caio Oliveira</strong> 👨‍💻
      </p>
      <a
        href="https://www.linkedin.com/in/caio-oliveira-37b766345/"
        target="_blank"
        style="color: #0077b5; text-decoration: none; font-weight: bold"
      >
        Conecte-se comigo no LinkedIn!
      </a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
